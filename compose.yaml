services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: securescan-backend:0.1.0
    ports:
      - "8000:8000"
    volumes:
      - securescan_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: securescan-frontend:0.1.0
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  securescan_data:
