services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        TRIVY_BINARY_SHA256: ${TRIVY_BINARY_SHA256:-d73380ef5e4128b14fe172849e3692addbc7d994b84a7b840b8c400985db0f6a}
    image: ghcr.io/melo2l/devops-internship-backend:${SECURESCAN_IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    environment:
      HOME: /tmp/semgrep-home
      XDG_CONFIG_HOME: /tmp/semgrep-config
      GIT_CONFIG_GLOBAL: /tmp/semgrep-home/.gitconfig
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
      - /home/appuser/.cache:rw,nosuid,nodev,size=512m,uid=10001,gid=10001
    volumes:
      - securescan_data:/data
      - trivy_cache:/home/appuser/.cache/trivy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/melo2l/devops-internship-frontend:${SECURESCAN_IMAGE_TAG:-latest}
    environment:
      SECURESCAN_API_INTERNAL_URL: http://backend:8000/api
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.8.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.29.0
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets/smtp_password:/etc/alertmanager/secrets/smtp_password:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--web.external-url=http://localhost:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD no ficheiro .env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  securescan_data:
  prometheus_data:
  grafana_data:
  trivy_cache:
    external: true
    name: securescan-trivy-cache