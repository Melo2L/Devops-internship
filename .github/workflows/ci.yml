name: SecureScan CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: securescan-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          npm install --global pnpm@11.24.0
          pnpm --version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm exec tsc --noEmit

      - name: Lint frontend
        run: pnpm run lint

      - name: Run frontend tests
        run: pnpm test

      - name: Build frontend
        run: pnpm run build

  backend:
    name: Backend tests and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl -fsSL "${BASE}/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
          curl -fsSL "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt

          EXPECTED="$(awk -v file="${ARCHIVE}" '$2 == file {print $1}' /tmp/gitleaks_checksums.txt)"
          test -n "${EXPECTED}"

          printf '%s  %s\n' "${EXPECTED}" "/tmp/${ARCHIVE}" | sha256sum --check --status

          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

          gitleaks version
          rm -f "/tmp/${ARCHIVE}" /tmp/gitleaks_checksums.txt /tmp/gitleaks

      - name: Scan repository for secrets
        run: gitleaks git . --config gitleaks/.gitleaks.toml --redact --verbose

      - name: Lint backend
        run: ruff check backend

      - name: Run backend tests
        env:
          SECURESCAN_DATABASE_PATH: /tmp/securescan-tests/securescan.db
          PYTHONPATH: .
        run: |
          mkdir -p /tmp/securescan-tests
          pytest -q --cov=backend --cov-branch --cov-report=term-missing backend/tests

  terraform:
    name: Terraform quality gate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.17.1"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate

  security-scan:
    name: Trivy security quality gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download and verify Trivy binary
        env:
          TRIVY_VERSION: "0.76.2"
          TRIVY_ARCHIVE_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
          TRIVY_CHECKSUMS_SHA256: "802e4ac1418ed967cd3c4b901f4f71ca00b7363ede67778665a22d9f13f58c83"
        run: |
          set -euo pipefail

          ARCHIVE="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          BASE="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"

          curl -fsSL "${BASE}/trivy_${TRIVY_VERSION}_checksums.txt" -o /tmp/trivy_checksums.txt
          echo "${TRIVY_CHECKSUMS_SHA256}  /tmp/trivy_checksums.txt" | sha256sum -c -

          curl -fsSL "${BASE}/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
          grep " ${ARCHIVE}$" /tmp/trivy_checksums.txt > /tmp/trivy_archive_checksum.txt
          echo "${TRIVY_ARCHIVE_SHA256}  /tmp/${ARCHIVE}" | sha256sum -c -
          (cd /tmp && sha256sum -c /tmp/trivy_archive_checksum.txt)

          tar -xzf "/tmp/${ARCHIVE}" -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: Scan dependencies for vulnerabilities
        run: |
          trivy fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            --exit-code 1 \
            .

      - name: Scan infrastructure and configuration
        run: |
          set -euo pipefail

          for target in Dockerfile backend/Dockerfile terraform; do
            echo "Scanning configuration target: ${target}"
            trivy config \
              --severity HIGH,CRITICAL \
              --format table \
              --exit-code 1 \
              "${target}"
          done

  prometheus-rules:
    name: Validate Prometheus alert rules
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Prometheus tools
        run: |
          PROMETHEUS_VERSION="3.8.0"
          ARCHIVE="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          BASE_URL="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}"

          curl -fsSL "${BASE_URL}/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp

          sudo install -m 0755 "/tmp/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool

          promtool --version

      - name: Check Prometheus alert rule syntax
        run: |
          promtool check rules monitoring/prometheus/rules/securescan-alerts.yml

      - name: Test Prometheus alert rules
        run: |
          promtool test rules monitoring/prometheus/tests/securescan-alerts-test.yml


  docker-build:
    name: Build and scan Docker images
    needs:
      - frontend
      - backend
      - terraform
      - security-scan
      - prometheus-rules
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download and verify Trivy binary
        env:
          TRIVY_VERSION: "0.76.2"
          TRIVY_ARCHIVE_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
          TRIVY_CHECKSUMS_SHA256: "802e4ac1418ed967cd3c4b901f4f71ca00b7363ede67778665a22d9f13f58c83"
        run: |
          set -euo pipefail

          ARCHIVE="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          BASE="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"

          mkdir -p tools
          curl -fsSL "${BASE}/trivy_${TRIVY_VERSION}_checksums.txt" -o /tmp/trivy_checksums.txt
          echo "${TRIVY_CHECKSUMS_SHA256}  /tmp/trivy_checksums.txt" | sha256sum -c -

          curl -fsSL "${BASE}/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
          grep " ${ARCHIVE}$" /tmp/trivy_checksums.txt > /tmp/trivy_archive_checksum.txt
          echo "${TRIVY_ARCHIVE_SHA256}  /tmp/${ARCHIVE}" | sha256sum -c -
          (cd /tmp && sha256sum -c /tmp/trivy_archive_checksum.txt)

          tar -xzf "/tmp/${ARCHIVE}" -C /tmp trivy
          install -m 0755 /tmp/trivy tools/trivy

          echo "TRIVY_BINARY_SHA256=$(sha256sum tools/trivy | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          ./tools/trivy --version

      - name: Build frontend and backend images
        env:
          GRAFANA_ADMIN_PASSWORD: "ci-test-only-password"
        run: docker compose build

      - name: Scan frontend Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/melo2l/devops-internship-frontend:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Scan backend Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/melo2l/devops-internship-backend:latest
          skip-files: '**/pip/_vendor/bom.cdx.json'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  docker-publish:
    name: Publish Docker images to GHCR
    needs:
      - frontend
      - backend
      - terraform
      - security-scan
      - prometheus-rules
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download and verify Trivy binary
        env:
          TRIVY_VERSION: "0.76.2"
          TRIVY_ARCHIVE_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
          TRIVY_CHECKSUMS_SHA256: "802e4ac1418ed967cd3c4b901f4f71ca00b7363ede67778665a22d9f13f58c83"
        run: |
          set -euo pipefail

          ARCHIVE="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          BASE="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"

          mkdir -p tools
          curl -fsSL "${BASE}/trivy_${TRIVY_VERSION}_checksums.txt" -o /tmp/trivy_checksums.txt
          echo "${TRIVY_CHECKSUMS_SHA256}  /tmp/trivy_checksums.txt" | sha256sum -c -

          curl -fsSL "${BASE}/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
          grep " ${ARCHIVE}$" /tmp/trivy_checksums.txt > /tmp/trivy_archive_checksum.txt
          echo "${TRIVY_ARCHIVE_SHA256}  /tmp/${ARCHIVE}" | sha256sum -c -
          (cd /tmp && sha256sum -c /tmp/trivy_archive_checksum.txt)

          tar -xzf "/tmp/${ARCHIVE}" -C /tmp trivy
          install -m 0755 /tmp/trivy tools/trivy

          echo "TRIVY_BINARY_SHA256=$(sha256sum tools/trivy | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          ./tools/trivy --version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/melo2l/devops-internship-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      - name: Extract Docker metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/melo2l/devops-internship-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          build-args: |
            TRIVY_BINARY_SHA256=${{ env.TRIVY_BINARY_SHA256 }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

  deploy:
    name: Deploy SecureScan on Ubuntu
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, securescan-deploy]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Pull published Docker images
        env:
          DEPLOY_ENV_FILE: /home/melo/Downloads/securescan-melo-clean/.env
        run: |
          TAG="sha-$(git rev-parse --short=7 "$GITHUB_SHA")"
          export SECURESCAN_IMAGE_TAG="$TAG"

          echo "Deploying images with tag: $TAG"

          docker compose \
            --project-name securescan-melo-clean \
            --project-directory /home/melo/Downloads/securescan-melo-clean \
            --env-file "$DEPLOY_ENV_FILE" \
            -f "$GITHUB_WORKSPACE/compose.yaml" \
            pull backend frontend

      - name: Update backend and frontend
        env:
          DEPLOY_ENV_FILE: /home/melo/Downloads/securescan-melo-clean/.env
        run: |
          TAG="sha-$(git rev-parse --short=7 "$GITHUB_SHA")"
          export SECURESCAN_IMAGE_TAG="$TAG"

          docker compose \
            --project-name securescan-melo-clean \
            --project-directory /home/melo/Downloads/securescan-melo-clean \
            --env-file "$DEPLOY_ENV_FILE" \
            -f "$GITHUB_WORKSPACE/compose.yaml" \
            up -d --no-build backend frontend

      - name: Verify backend and frontend
        run: |
          echo "Checking backend health..."

          backend_ok=0

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              backend_ok=1
              break
            fi

            sleep 2
          done

          if [ "$backend_ok" -ne 1 ]; then
            echo "ERROR: Backend health check failed."
            exit 1
          fi

          echo ""
          echo "Checking frontend HTTP response..."

          frontend_ok=0

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ -o /dev/null; then
              frontend_ok=1
              break
            fi

            sleep 2
          done

          if [ "$frontend_ok" -ne 1 ]; then
            echo "ERROR: Frontend HTTP check failed."
            exit 1
          fi

          echo "Deployment verification successful."
