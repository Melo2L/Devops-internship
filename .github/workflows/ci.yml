name: SecureScan CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: securescan-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          npm install --global pnpm@11.24.0
          pnpm --version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm exec tsc --noEmit

      - name: Lint frontend
        run: pnpm run lint

      - name: Run frontend tests
        run: pnpm test

      - name: Build frontend
        run: pnpm run build

  backend:
    name: Backend tests and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl -fsSL "${BASE}/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
          curl -fsSL "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt

          EXPECTED="$(awk -v file="${ARCHIVE}" '$2 == file {print $1}' /tmp/gitleaks_checksums.txt)"
          test -n "${EXPECTED}"

          printf '%s  %s\n' "${EXPECTED}" "/tmp/${ARCHIVE}" | sha256sum --check --status

          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

          gitleaks version
          rm -f "/tmp/${ARCHIVE}" /tmp/gitleaks_checksums.txt /tmp/gitleaks

      - name: Scan repository for secrets
        run: gitleaks git . --redact --verbose

      - name: Lint backend
        run: ruff check backend

      - name: Run backend tests
        env:
          SECURESCAN_DATABASE_PATH: /tmp/securescan-tests/securescan.db
          PYTHONPATH: .
        run: |
          mkdir -p /tmp/securescan-tests
          pytest -q backend/tests

  terraform:
    name: Terraform quality gate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate

  security-scan:
    name: Trivy security quality gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Scan dependencies for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Scan infrastructure and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"

  prometheus-rules:
    name: Validate Prometheus alert rules
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Prometheus tools
        run: |
          PROMETHEUS_VERSION="3.8.0"
          ARCHIVE="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          BASE_URL="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}"

          curl -fsSL "${BASE_URL}/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp

          sudo install -m 0755 "/tmp/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool

          promtool --version

      - name: Check Prometheus alert rule syntax
        run: |
          promtool check rules monitoring/prometheus/rules/securescan-alerts.yml

      - name: Test Prometheus alert rules
        run: |
          promtool test rules monitoring/prometheus/tests/securescan-alerts-test.yml

  docker-build:
    name: Build Docker images
    needs:
      - frontend
      - backend
      - terraform
      - security-scan
      - prometheus-rules
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build frontend and backend images
        env:
          GRAFANA_ADMIN_PASSWORD: "ci-test-only-password"
        run: docker compose build

  docker-publish:
    name: Publish Docker images to GHCR
    needs:
      - frontend
      - backend
      - terraform
      - security-scan
      - prometheus-rules
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/melo2l/devops-internship-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      - name: Extract Docker metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/melo2l/devops-internship-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
