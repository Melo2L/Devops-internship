name: SecureScan CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: securescan-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          npm install --global pnpm@11.24.0
          pnpm --version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm exec tsc --noEmit

      - name: Lint frontend
        run: pnpm run lint

      - name: Run frontend tests
        run: pnpm test

      - name: Build frontend
        run: pnpm run build

  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl -fsSL "${BASE}/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
          curl -fsSL "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt

          EXPECTED="$(awk -v file="${ARCHIVE}" '$2 == file {print $1}' /tmp/gitleaks_checksums.txt)"
          test -n "${EXPECTED}"

          printf '%s  %s\n' "${EXPECTED}" "/tmp/${ARCHIVE}" | sha256sum --check --status

          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

          gitleaks version
          rm -f "/tmp/${ARCHIVE}" /tmp/gitleaks_checksums.txt /tmp/gitleaks

      - name: Lint backend
        run: ruff check backend

      - name: Run backend tests
        env:
          SECURESCAN_DATABASE_PATH: /tmp/securescan-tests/securescan.db
          PYTHONPATH: .
        run: |
          mkdir -p /tmp/securescan-tests
          pytest -q backend/tests

  docker-build:
    needs: [frontend, backend]
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend and backend images
        env:
          GRAFANA_ADMIN_PASSWORD: "ci-test-only-password"
        run: docker compose build
