[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.coverage.run]
branch = true
source = ["backend"]
omit = [
    "backend/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
